input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/mysql-connector-j-8.0.33.jar" # Đường dẫn tới JDBC driver
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver" # Driver MySQL
    jdbc_connection_string => "jdbc:mysql://docker-mysql:3306/electronic_ecommerce?autoReconnect=true&allowPublicKeyRetrieval=true&useSSL=false" # Thay bằng thông tin thực tế
    jdbc_user => "root" # Username DB
    jdbc_password => "1234" # Password DB
    jdbc_paging_enabled => "true" # Kích hoạt phân trang nếu dữ liệu lớn
    jdbc_page_size => 50000
    statement => "SELECT * FROM Product"
  }
}

filter {
  mutate {
    # Gán giá trị mặc định cho productUrl nếu listImageOfProduct rỗng hoặc không chứa ảnh chính
    add_field => { "productUrl" => "%{[GlobalUtils][DEFAULT_URL]}" }
  }

  mutate {
    # Xử lý các trường dữ liệu khác, chuyển đổi hoặc gán giá trị nếu cần
    add_field => {
      "shopCategoryIds" => "%{[shopCategoryProducts][id]}"
      "categoryIds" => "%{[category][id]}"
    }
  }

  # Loại bỏ các trường không cần thiết
  prune {
    blacklist_names => [ "listImageOfProduct", "shopCategoryProducts", "category" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"] # Kết nối tới Elasticsearch
    index => "product-document" # Tên index trong Elasticsearch
    document_id => "%{id}" # ID tài liệu dựa trên trường `id` của product
  }
  stdout {
    codec => json
  }
}
